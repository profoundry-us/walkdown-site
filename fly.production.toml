# Fly.io config for the production site (walkdown.dev).
# Deploy with `fly deploy -c fly.production.toml`; plain `fly deploy` ships staging.

app = "walkdown-site"
primary_region = "dfw"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
